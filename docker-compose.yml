version: '3.8'

services:
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./api-service:/app
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npx nodemon -L --watch src --ext ts --exec "node --no-warnings --loader ts-node/esm src/server.ts"
    depends_on:
      - redis

  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile.dev
    volumes:
      - ./worker-service:/app
      - ./worker-service/logs:/app/logs
    ports:
      - "3001:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npx nodemon -L --watch src --ext ts --exec "node --no-warnings --loader ts-node/esm src/worker.ts"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
    driver: local
